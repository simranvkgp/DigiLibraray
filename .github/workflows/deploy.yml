name: CI/CD - Build, Push, Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/digiclass-library

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in, pull image, run container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "===== digiclass-library deploy ====="
            echo "Server IP : $(hostname -I 2>/dev/null | awk '{print $1}')"
            echo "SSH user  : $(whoami)"
            echo "Image     : ${{ env.IMAGE_NAME }}:latest"
            echo "Commit    : ${{ github.sha }}"
            echo "====================================="

            mkdir -p ~/digiclass-library
            cd ~/digiclass-library

            cat > .env <<'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            BLOB_READ_WRITE_TOKEN=${{ secrets.BLOB_READ_WRITE_TOKEN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ secrets.VAPID_SUBJECT }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            ENVEOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            OLD_IMAGE_ID=$(docker inspect --format='{{.Image}}' digiclass-library 2>/dev/null || echo "")

            docker pull ${{ env.IMAGE_NAME }}:latest

            docker stop digiclass-library 2>/dev/null || true
            docker rm digiclass-library 2>/dev/null || true

            docker run -d \
              --name digiclass-library \
              --restart unless-stopped \
              -p 3011:3000 \
              --env-file .env \
              ${{ env.IMAGE_NAME }}:latest

            sleep 5

            if [ "$(docker inspect -f '{{.State.Running}}' digiclass-library 2>/dev/null)" = "true" ]; then
              echo "Container started successfully on port 3011."
              docker logs --tail 30 digiclass-library

              if [ -n "$OLD_IMAGE_ID" ]; then
                NEW_IMAGE_ID=$(docker inspect --format='{{.Image}}' digiclass-library)
                if [ "$OLD_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
                  echo "Removing previous image: $OLD_IMAGE_ID"
                  docker rmi "$OLD_IMAGE_ID" || true
                fi
              fi
              docker image prune -f
            else
              echo "Container failed to start! Logs:"
              docker logs digiclass-library || true
              docker logout
              exit 1
            fi

            docker logout
